<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NineFlow</title>
    <meta name="description" content="NineFlow: plan better, flow forward. A planner, focus timer and work log, saved in your own Google Drive." />
    <meta name="theme-color" content="#FAF7F0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NineFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var id = localStorage.getItem('daily-planner:current');
        var key = id ? 'daily-planner:' + id + ':settings' : 'daily-planner:settings';
        var s = JSON.parse(localStorage.getItem(key) || '{}');
        if ((s.theme || 'light') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
